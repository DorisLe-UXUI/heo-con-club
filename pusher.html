<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Đẩy Xu · Heo Con Club</title>
<style>
@font-face{font-family:"Grandstander Black";src:url("assets/fonts/GrandstanderBlack-Regular.ttf") format("truetype");font-display:swap}
@font-face{font-family:"Baloo 2";src:url("assets/fonts/Baloo2%5Bwght%5D.ttf") format("truetype");font-weight:400 800;font-display:swap}
@font-face{font-family:"Nunito";src:url("assets/fonts/Nunito%5Bwght%5D.ttf") format("truetype");font-weight:200 1000;font-display:swap}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:Nunito,system-ui,sans-serif;color:#5a2342;touch-action:none;background:radial-gradient(circle at 50% 0,#ffe3f0,#e9d9ff 55%,#c9e4ff)}
img{-webkit-user-drag:none}
.hide{display:none!important}
#scene{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#ui{position:fixed;left:0;top:0;transform-origin:0 0;pointer-events:none}
#ui > *{pointer-events:auto}
.btn{cursor:pointer;transition:transform .12s,filter .12s}.btn:hover{transform:translateY(-3px) scale(1.04);filter:brightness(1.06)}.btn:active{transform:translateY(2px) scale(.96)}
.glass{background:rgba(255,255,255,.93);border:4px solid #fff;border-radius:36px;box-shadow:0 8px 0 rgba(194,64,122,.28),0 14px 28px rgba(60,10,50,.22)}
.pill{position:relative;height:78px;padding:0 30px 0 86px;border-radius:40px;display:flex;align-items:center;font:400 36px "Grandstander Black";color:#a86d00;white-space:nowrap}
.pill img{position:absolute;left:4px;top:-2px;width:78px}
.pill.tk{color:#c2407a}
.big{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;height:100px;border-radius:50px;font:400 42px "Grandstander Black";color:#fff;cursor:pointer;white-space:nowrap;text-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .12s,filter .12s}
.big:hover{transform:translateY(-3px);filter:brightness(1.06)}.big:active{transform:translateY(3px)}
.big.pink{background:linear-gradient(#ff9cc4,#ff4f95);box-shadow:0 9px 0 #c2407a,0 16px 24px rgba(194,64,122,.35)}
.big.mint{background:linear-gradient(#7ff0c4,#2fc58e);box-shadow:0 9px 0 #1f9a70,0 16px 24px rgba(31,154,112,.3)}
.big.lemon{background:linear-gradient(#ffe68a,#ffb81c);box-shadow:0 9px 0 #b07800,0 16px 24px rgba(176,120,0,.3)}
.big.grey{background:linear-gradient(#f2eef6,#bdb3c9);box-shadow:0 9px 0 #8a8496}
.big.small{height:72px;font-size:28px;padding:0 26px}
.title{font:400 64px "Grandstander Black";color:#fff;-webkit-text-stroke:12px #c2407a;paint-order:stroke fill;text-shadow:0 8px 0 #c2407a}

/* top bar (both screens) */
#top{position:absolute;left:16px;right:16px;top:14px;height:100px;display:flex;align-items:center;gap:18px;pointer-events:none}
#top > *{pointer-events:auto}
#back{width:96px;height:96px;flex:none}
#back img{width:96px;filter:drop-shadow(0 6px 8px rgba(60,10,50,.25))}
#where{flex:none;padding:10px 30px;font:400 38px "Grandstander Black";color:#b0306e;border-radius:40px}
#where small{display:block;font:800 22px "Baloo 2";color:#8a6a80;margin-top:-4px}
#top .sp{flex:1}
#top .pill{flex:none}
#xchg{flex:none}

/* machine select */
#select{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;padding-top:110px}
#select .title{font-size:84px}
#cards{display:flex;gap:40px}
#select > *{zoom:1.22} /* a menu with nothing behind it: let it be bigger than the in-game HUD */
.mc{position:relative;width:440px;padding:26px 26px 30px;border-radius:50px;cursor:pointer;transition:transform .15s}
.mc:hover{transform:translateY(-10px)}
.mc .art{position:relative;height:230px;border-radius:36px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.mc .art img.m{width:160px;filter:drop-shadow(0 10px 10px rgba(0,0,0,.18))}
.mc .art img.s{position:absolute;width:90px}
.mc h3{margin:18px 0 4px;text-align:center;font:400 40px "Grandstander Black";color:var(--d);white-space:nowrap}
.mc .bet{text-align:center;font:800 28px "Baloo 2";color:#7a5a6e}
.mc .bet b{font:400 30px "Grandstander Black";color:#a86d00}
.mc .jp{margin-top:10px;display:flex;align-items:center;justify-content:center;gap:10px;padding:6px 14px;border-radius:22px;background:linear-gradient(#fff6d6,#ffe58f);font:800 22px "Baloo 2";color:#8a5a00;white-space:nowrap}
.mc .jp img{width:36px}.mc .jp b{font:400 26px "Grandstander Black";color:#b06a00}
.mc .tag{position:absolute;right:18px;top:16px;padding:6px 18px;border-radius:20px;font:400 22px "Grandstander Black";color:#fff;background:var(--d);box-shadow:0 4px 0 rgba(0,0,0,.18);z-index:2}
.mc .fill{margin-top:12px;font:800 22px "Baloo 2";color:#7a5a6e}
.mc .fill .bar{height:22px;border-radius:11px;background:#f1e5ee;overflow:hidden;margin-top:6px}
.mc .fill .bar i{display:block;height:100%;border-radius:11px;background:linear-gradient(90deg,#ffd25a,#ff7eb3)}
.mc .big{margin-top:18px;height:84px;font-size:34px}
#tipsSel{max-width:1380px;padding:20px 34px;font:800 26px "Baloo 2";color:#6a4a5e;line-height:1.35}
#tipsSel b{color:#c2407a}

/* play HUD */
#play{position:absolute;inset:0;pointer-events:none}
#play > *{pointer-events:auto}
#tips{position:absolute;left:16px;top:140px;width:400px;padding:22px 24px}
#tips h4,#legend h4,#sets h4{margin:0 0 10px;display:flex;align-items:center;gap:10px;font:400 30px "Grandstander Black";color:#5f3fc9;cursor:pointer}
#tips h4 img,#legend h4 img,#sets h4 img{width:44px}
#tips .tp{display:flex;gap:12px;margin:12px 0;font:800 22px "Baloo 2";color:#5a2342;line-height:1.3}
#tips .tp i{flex:none;width:40px;height:40px;border-radius:50%;background:linear-gradient(#ff9cc4,#ff4f95);color:#fff;font:400 24px "Grandstander Black";font-style:normal;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #c2407a}
#tips.mini{width:auto}#tips.mini .tp{display:none}
#side{position:absolute;right:16px;top:140px;width:350px;display:flex;flex-direction:column;gap:18px;pointer-events:none}
#side > *{pointer-events:auto}
#legend,#sets{padding:20px 22px}
#legend .row{display:flex;align-items:center;gap:10px;margin:6px 0;font:800 21px "Baloo 2";color:#5a2342;white-space:nowrap}
#legend .row img{width:44px;height:44px;object-fit:contain}
#legend .row b{margin-left:auto;font:400 22px "Grandstander Black";color:#a86d00;white-space:nowrap}
#legend .row b.t{color:#c2407a}
#legend .sub{margin:12px 0 2px;font:400 19px "Grandstander Black";color:#c2407a;white-space:nowrap}
#legend .reel div{display:flex;align-items:center;gap:8px;margin:3px 0;font:800 20px "Baloo 2";color:#5a2342;white-space:nowrap}
#legend .reel div i{display:flex;gap:1px;flex:none}
#legend .reel img{width:26px;height:26px}
#legend .reel b{margin-left:auto;font:400 20px "Grandstander Black";color:#a86d00}
#legend.mini .row,#legend.mini .sub,#legend.mini .reel{display:none}
#sets .set{margin:4px 0 12px}
#sets .set:last-child{margin-bottom:0}
#sets .nm{display:flex;justify-content:space-between;font:800 21px "Baloo 2";color:#5a2342}
#sets .nm b{font:400 22px "Grandstander Black";color:#a86d00}
#sets .cs{display:flex;gap:6px;margin-top:6px}
#sets .cs img{width:52px;height:75px;border-radius:7px;box-shadow:0 3px 6px rgba(60,10,50,.25);transition:filter .3s,opacity .3s,transform .3s}
#sets .cs img.off{filter:grayscale(1) brightness(1.15);opacity:.32;box-shadow:none}
#sets .cs img.new{animation:cardIn .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes cardIn{0%{transform:scale(1.9) rotate(-12deg)}100%{transform:none}}
#ctrl{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:26px;padding:16px 26px;border-radius:56px}
#phase{width:400px}
#phase .lbl{display:flex;justify-content:space-between;font:800 22px "Baloo 2";color:#7a5a6e}
#phase .lbl b{color:#2fae7a;transition:opacity .15s,color .15s}
#phase .lbl b.cup{color:#e0408a}
#phase .track{position:relative;height:40px;margin-top:6px;border-radius:20px;background:#f1e5ee;overflow:hidden;box-shadow:inset 0 3px 6px rgba(160,60,110,.18)}
#phase .zone{position:absolute;left:0;top:0;bottom:0;width:22%;background:linear-gradient(90deg,#7ff0c4,#c9f6e6)}
#phase .zone2{position:absolute;left:50%;right:0;top:0;bottom:0;background:linear-gradient(90deg,#ffe0ee,#ffb3d1)}
#phase .knob{position:absolute;top:4px;width:60px;height:32px;margin-left:-30px;border-radius:16px;background:linear-gradient(#ff9cc4,#ff4f95);box-shadow:0 3px 0 #c2407a}
#drop{width:330px}
#drop.ready{animation:glow 1s ease-in-out infinite}
#drop.fever{background:linear-gradient(#ffe68a,#ff9f1c);box-shadow:0 9px 0 #b06a00,0 16px 24px rgba(176,106,0,.35)}
@keyframes glow{50%{box-shadow:0 9px 0 #c2407a,0 0 0 10px rgba(127,240,196,.55),0 16px 24px rgba(194,64,122,.35)}}
#auto{display:flex;flex-direction:column;align-items:center;gap:6px;font:800 22px "Baloo 2";color:#7a5a6e;cursor:pointer}
#auto i{width:84px;height:46px;border-radius:23px;background:#e6d6e0;position:relative;transition:background .2s}
#auto i::after{content:"";position:absolute;left:5px;top:5px;width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:left .2s}
#auto.on i{background:#2fc58e}#auto.on i::after{left:43px}
#hint{position:absolute;left:50%;bottom:170px;transform:translateX(-50%);padding:8px 26px;border-radius:24px;background:rgba(50,22,60,.62);color:#fff;font:800 24px "Baloo 2";white-space:nowrap}
#status{position:absolute;left:50%;bottom:226px;transform:translateX(-50%);display:flex;gap:12px;pointer-events:none!important}
#status .chip{display:flex;align-items:center;gap:8px;padding:6px 18px 6px 8px;border-radius:30px;background:rgba(255,255,255,.95);border:3px solid #fff;box-shadow:0 5px 0 rgba(194,64,122,.25);font:400 24px "Grandstander Black";color:#5a2342;white-space:nowrap;animation:chipIn .35s cubic-bezier(.2,1.6,.4,1)}
#status .chip img{width:40px}
#status .chip.fv{background:linear-gradient(#fff3b0,#ffc93c);color:#8a4a00;border-color:#ffe27a;box-shadow:0 5px 0 #c98a00}
#status .chip.wl{color:#1f6fc0}#status .chip.ps{color:#c25a00}
@keyframes chipIn{from{transform:scale(.5);opacity:0}}
#fx{position:absolute;inset:0;pointer-events:none!important;overflow:hidden;z-index:30}
.pop{position:absolute;font:400 40px "Grandstander Black";color:#ffe27a;-webkit-text-stroke:7px #a86d00;paint-order:stroke fill;animation:up 1.1s ease-out forwards;white-space:nowrap}
.pop.t{color:#ffd1e6;-webkit-text-stroke-color:#c2407a}
.pop.f{color:#fff27a;-webkit-text-stroke-color:#d06a00;font-size:48px;text-shadow:0 0 18px rgba(255,190,40,.9)}
.pop.c{color:#ffe0f0;-webkit-text-stroke-color:#e0408a;font-size:34px}
@keyframes up{to{transform:translateY(-140px);opacity:0}}
.callout{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font:400 110px "Grandstander Black";color:#fff27a;-webkit-text-stroke:16px #c2407a;paint-order:stroke fill;text-shadow:0 12px 0 #c2407a;white-space:nowrap;animation:callout 1.6s cubic-bezier(.2,1.4,.4,1) forwards}
.callout small{display:block;text-align:center;font-size:52px;-webkit-text-stroke-width:10px}
.callout.gold{color:#fff6c2;-webkit-text-stroke-color:#d06a00;text-shadow:0 12px 0 #a85400}
.callout.blue{color:#e6f6ff;-webkit-text-stroke-color:#1f6fc0;text-shadow:0 12px 0 #1f5a9a}
@keyframes callout{0%{transform:translate(-50%,-50%) scale(.2) rotate(-10deg);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15) rotate(3deg);opacity:1}40%{transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{transform:translate(-50%,-80%) scale(1.05);opacity:0}}
.confetti{position:absolute;top:-30px;width:16px;height:26px;border-radius:4px}
#toast{position:absolute;left:50%;bottom:300px;transform:translateX(-50%);z-index:40;display:none;align-items:center;gap:12px;padding:12px 32px 12px 16px;border-radius:36px;background:#fff;border:4px solid #ffd0e4;color:#7a2a56;font:800 28px "Baloo 2";white-space:nowrap;box-shadow:0 8px 0 rgba(194,64,122,.3)}
#toast img{width:48px;max-height:60px;object-fit:contain}
#modal{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(50,20,50,.5);backdrop-filter:blur(4px)}
#modal.on{display:flex}
.panel{position:relative;width:900px;padding:60px 50px 46px;border-radius:56px;background:linear-gradient(#fff,#fff4f9);border:6px solid #ffd0e4;box-shadow:0 14px 0 #f2a9c8,0 30px 60px rgba(60,10,40,.4);text-align:center}
.panel h2{margin:0 0 14px;font:400 56px "Grandstander Black";color:#c2407a}
.panel p{margin:10px 0;font:800 30px "Baloo 2";color:#6a4a5e}
.panel .row{display:flex;justify-content:center;gap:26px;margin-top:26px}
#loading{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:radial-gradient(circle at 50% 40%,#fff0f7,#ffd1e6 45%,#d9c8ff);transition:opacity .4s}
#loading.out{opacity:0;pointer-events:none}
#loading img{width:200px;animation:b .8s ease-in-out infinite alternate}
@keyframes b{to{transform:translateY(-24px) rotate(8deg)}}
#loading b{font:400 50px "Grandstander Black";color:#fff;-webkit-text-stroke:9px #c2407a;paint-order:stroke fill}
/* Fever: a warm golden glow around the whole window */
#feverFx{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:0;transition:opacity .5s;box-shadow:inset 0 0 90px 24px rgba(255,186,40,.75),inset 0 0 0 8px rgba(255,214,90,.9)}
#feverFx.on{opacity:1;animation:fv .55s ease-in-out infinite alternate}
@keyframes fv{to{box-shadow:inset 0 0 140px 40px rgba(255,150,30,.8),inset 0 0 0 12px rgba(255,236,140,.95)}}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="feverFx"></div>
<div id="ui">
  <div id="top">
    <div id="back" class="btn" title="Quay lại"><img src="assets/ui-jelly-pzuh/buttons-pastel/pink/icon_back_pink.png?v=202610231911"></div>
    <div id="where" class="glass">Máy Đẩy Xu<small id="whereSub">Chọn một máy để chơi</small></div>
    <div class="sp"></div>
    <div class="pill glass"><img src="assets/emoji-fluent-3d/game/coin.png?v=202610231911"><span id="coinTxt">0</span></div>
    <div class="pill glass tk"><img src="assets/emoji-fluent-3d/game/admission_tickets.png?v=202610231911"><span id="tkTxt">0</span></div>
    <div class="big lemon small btn" id="xchg">Đổi vé</div>
  </div>

  <div id="select">
    <div class="title">Máy Đẩy Xu</div>
    <div id="cards"></div>
    <div id="tipsSel" class="glass"></div>
  </div>

  <div id="play" class="hide">
    <div id="tips" class="glass"><h4><img src="assets/emoji-fluent-3d/game/light_bulb.png?v=202610231911">Mẹo chơi</h4></div>
    <div id="side">
      <div id="legend" class="glass"><h4><img src="assets/emoji-fluent-3d/game/wrapped_gift.png?v=202610231911">Phần thưởng</h4></div>
      <div id="sets" class="glass"><h4><img src="assets/emoji-fluent-3d/game/joker.png?v=202610231911">Bộ thẻ</h4></div>
    </div>
    <div id="status"></div>
    <div id="hint">Rê chuột hoặc kéo để ngắm · Chạm hoặc Space để thả</div>
    <div id="ctrl" class="glass">
      <div id="phase"><div class="lbl"><span>Khay đẩy</span><b id="phaseTxt">Thả ngay!</b></div><div class="track"><div class="zone"></div><div class="zone2"></div><div class="knob" id="knob"></div></div></div>
      <div class="big pink" id="drop"><img src="assets/emoji-fluent-3d/game/coin.png?v=202610231911" style="width:58px">THẢ XU</div>
      <div id="auto"><i></i>Tự thả</div>
    </div>
  </div>

  <div id="fx"></div>
  <div id="toast"><img id="toastImg" src="assets/emoji-fluent-3d/game/coin.png?v=202610231911"><span id="toastTxt"></span></div>
  <div id="modal"></div>
  <div id="loading"><img src="assets/emoji-fluent-3d/game/coin.png?v=202610231911"><b>Đang bật máy đẩy xu…</b></div>
</div>

<script src="js/vendor/three.min.js"></script>
<script src="js/vendor/GLTFLoader.js"></script>
<script src="js/vendor/SkeletonUtils.js"></script>
<script src="js/hc3d.js"></script>
<script src="js/hc-core.js"></script>
<script src="js/hc-progress.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/hc-online.js"></script>
<script src="js/pusher-sim.js"></script>
<script>
'use strict';
const Q = new URLSearchParams(location.search), SHOT = Q.has('shot'), DEMO = Q.get('demo') || '';
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const A = HC.A, fmt = HC.fmt, store = HC.store, T = THREE, PS = PusherSim, CFG = PS.CFG;
const rnd = (a, b) => a + Math.random() * (b - a), pick = a => a[Math.floor(Math.random() * a.length)];
function el(tag, attrs = {}, parent) { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) { if (k === 'style') e.style.cssText = v; else if (k === 'html') e.innerHTML = v; else if (k === 'text') e.textContent = v; else e.setAttribute(k, v); } if (parent) parent.appendChild(e); return e; }
const SND = {
  drop: 'audio-casino-kenney/Audio/chip-lay-1.ogg', land: 'audio-casino-kenney/Audio/chips-collide-1.ogg', win: 'audio-sfx-ninja/Bonus/Coin.wav', prize: 'audio-sfx-ninja/Bonus/Gold1.wav',
  big: 'audio-sfx-ninja/Jingles/Success1.wav', lucky: 'audio-digital-kenney/Audio/powerUp2.ogg', no: 'audio-interface-kenney/Audio/error_004.ogg', click: 'audio-ui-kenney/Audio/click1.ogg',
  pocket: 'audio-sfx-ninja/Bonus/Bonus.wav', reel: 'audio-interface-kenney/Audio/click_003.ogg', spin: 'audio-casino-kenney/Audio/dice-shake-1.ogg', reach: 'audio-digital-kenney/Audio/phaserUp3.ogg',
  miss: 'audio-digital-kenney/Audio/lowDown.ogg', fever: 'audio-sfx-ninja/Jingles/LevelUp1.wav', wall: 'audio-digital-kenney/Audio/phaseJump1.ogg', push: 'audio-digital-kenney/Audio/powerUp3.ogg',
  set: 'audio-jingles-kenney/Audio/Pizzicato jingles/jingles_PIZZI02.ogg', card: 'audio-casino-kenney/Audio/card-place-1.ogg',
};
let lastSnd = {};
function snd(n, v = .5) { if (SHOT || !HC.settings.sfx) return; const now = performance.now(); if (now - (lastSnd[n] || 0) < 45) return; lastSnd[n] = now; try { const a = new Audio(A(SND[n])); a.volume = v; a.play().catch(() => {}); } catch (e) {} }

// ------------------------------------------------------------------ layout
let uiS = 1, UW = 1920, UH = 1080;
function fit() {
  uiS = HC.uiScale(1600); UW = innerWidth / uiS; UH = innerHeight / uiS;
  const ui = $('#ui'); ui.style.width = UW + 'px'; ui.style.height = UH + 'px'; ui.style.transform = `scale(${uiS})`;
  if (st) { st.w = innerWidth; st.h = innerHeight; st.renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5)); st.renderer.setSize(innerWidth, innerHeight, false); st.camera.aspect = innerWidth / innerHeight; placeCamera(); }
  $('#tips').classList.toggle('mini', UW < 1800);
  $('#legend').classList.toggle('mini', UH < 1300 || UW < 1800);
}
addEventListener('resize', fit);

// ------------------------------------------------------------------ wallet & progression
const me = { coins: store.get('coins', 1250000), tickets: store.get('tickets', 0), gems: store.get('gems', 2480) };
function wallet(dc = 0, dt = 0, dg = 0) {
  me.coins = Math.max(0, me.coins + dc); me.tickets = Math.max(0, me.tickets + dt); me.gems += dg;
  store.set('coins', me.coins); store.set('tickets', me.tickets); if (dg) store.set('gems', me.gems);
  $('#coinTxt').textContent = fmt(me.coins); $('#tkTxt').textContent = fmt(me.tickets);
}
// rewards from the progression module (level-ups, quests…) go through the in-memory wallet, so a later wallet() call cannot overwrite them
HC.giveCoins = n => wallet(n, 0);
HC.giveGems = n => wallet(0, 0, n);
function prog(type, data) { try { if (HC.prog) HC.prog.track(type, Object.assign({ game: 'day-xu' }, data)); } catch (e) {} }
let winAcc = 0, winT = 0;   // coins won are reported in small batches (one coin falls every ~0.5 s)

  prizeMeshes.forEach(x => machine.remove(x)); prizeMeshes.clear();

  mode = 'play'; $('#select').classList.add('hide'); $('#play').classList.remove('hide');
  $('#where').firstChild.textContent = m.name; $('#whereSub').textContent = `Mỗi xu ${fmt(m.bet)} · ${m.note}`;

    case 'jackpot': won(e.coins * bet); callout('JACKPOT!', 'gold', 'Hũ Heo Vàng +' + fmt(e.coins * bet)); confetti(180, ['#ffd34d', '#ffb300', '#fff27a', '#ff9cc4', '#fff']); snd('big', .7); prog('combo', { kind: 'jackpot' }); break;
    case 'shower': callout('MƯA XU!', 'gold', `${e.free} xu rơi xuống sân`); snd('prize', .5); break;
    case 'tickets': wallet(0, e.tickets); callout(`+${fmt(e.tickets)} VÉ!`, ''); snd('prize', .5); break;

// ------------------------------------------------------------------ input
const ray = new T.Raycaster(), ndc = new T.Vector2(), plane = new T.Plane(new T.Vector3(0, 1, 0), 0);
function aimFrom(ev) {
  if (!st) return; const r = $('#scene').getBoundingClientRect(); ndc.set((ev.clientX - r.left) / r.width * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);

addEventListener('keydown', e => {
  if (mode !== 'play') return;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); tryDrop(); }
  if (e.key === 'ArrowLeft' || e.key === 'a') aimX = Math.max(-FW + .45, aimX - .35);

$('#drop').onclick = () => tryDrop();

$('#back').onclick = () => { snd('click'); if (mode === 'play') { save(); game = sim = null; $('#feverFx').classList.remove('on'); showSelect(); } else HC.goto(HC.from() === 'town' ? 'index.html?look=day-xu' : 'lobby.html?sel=day-xu', HC.from() === 'town' ? 'Đang về thị trấn…' : 'Đang mở bản đồ…'); };
$('#tips h4').onclick = () => $('#tips').classList.toggle('mini');
$('#legend h4').onclick = () => $('#legend').classList.toggle('mini');
$('#xchg').onclick = () => {
  snd('click'); const m = $('#modal'); m.innerHTML = ''; m.classList.add('on');
  const p = el('div', { class: 'panel' }, m); el('h2', { text: 'Đổi vé lấy xu' }, p);
  el('p', { html: `Bạn có <b style="color:#c2407a">${fmt(me.tickets)} vé</b>. Mỗi vé đổi được <b style="color:#a86d00">500 xu</b>.` }, p);

};
addEventListener('visibilitychange', () => { if (document.hidden) save(); });
addEventListener('pagehide', save);

// ------------------------------------------------------------------ boot
(async () => {
  HC.arrive(); fit(); wallet();
  const tp = $('#tips'); TIPS.forEach((t, i) => el('div', { class: 'tp', html: `<i>${i + 1}</i><div><b style="color:#c2407a">${t[0]}.</b> ${t[1]}</div>` }, tp));
  try { await Promise.race([Promise.all([document.fonts.load('400 100px "Grandstander Black"'), document.fonts.load('800 20px "Baloo 2"')]), new Promise(r => setTimeout(r, 2500))]); } catch (e) {}
