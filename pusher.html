<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Đẩy Xu · Heo Con Club</title>
<style>
@font-face{font-family:"Grandstander Black";src:url("assets/fonts/GrandstanderBlack-Regular.ttf") format("truetype");font-display:swap}
@font-face{font-family:"Baloo 2";src:url("assets/fonts/Baloo2%5Bwght%5D.ttf") format("truetype");font-weight:400 800;font-display:swap}
@font-face{font-family:"Nunito";src:url("assets/fonts/Nunito%5Bwght%5D.ttf") format("truetype");font-weight:200 1000;font-display:swap}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:Nunito,system-ui,sans-serif;color:#5a2342;touch-action:none;background:radial-gradient(circle at 50% 0,#ffe3f0,#e9d9ff 55%,#c9e4ff)}
img{-webkit-user-drag:none}
.hide{display:none!important}
#scene{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#ui{position:fixed;left:0;top:0;transform-origin:0 0;pointer-events:none}
#ui > *{pointer-events:auto}
.btn{cursor:pointer;transition:transform .12s,filter .12s}.btn:hover{transform:translateY(-3px) scale(1.04);filter:brightness(1.06)}.btn:active{transform:translateY(2px) scale(.96)}
.glass{background:rgba(255,255,255,.93);border:4px solid #fff;border-radius:36px;box-shadow:0 8px 0 rgba(194,64,122,.28),0 14px 28px rgba(60,10,50,.22)}
.pill{position:relative;height:78px;padding:0 30px 0 86px;border-radius:40px;display:flex;align-items:center;font:400 36px "Grandstander Black";color:#a86d00;white-space:nowrap}
.pill img{position:absolute;left:4px;top:-2px;width:78px}
.pill.tk{color:#c2407a}
.big{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;height:100px;border-radius:50px;font:400 42px "Grandstander Black";color:#fff;cursor:pointer;white-space:nowrap;text-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .12s,filter .12s}
.big:hover{transform:translateY(-3px);filter:brightness(1.06)}.big:active{transform:translateY(3px)}
.big.pink{background:linear-gradient(#ff9cc4,#ff4f95);box-shadow:0 9px 0 #c2407a,0 16px 24px rgba(194,64,122,.35)}
.big.mint{background:linear-gradient(#7ff0c4,#2fc58e);box-shadow:0 9px 0 #1f9a70,0 16px 24px rgba(31,154,112,.3)}
.big.lemon{background:linear-gradient(#ffe68a,#ffb81c);box-shadow:0 9px 0 #b07800,0 16px 24px rgba(176,120,0,.3)}
.big.grey{background:linear-gradient(#f2eef6,#bdb3c9);box-shadow:0 9px 0 #8a8496}
.big.small{height:72px;font-size:28px;padding:0 26px}
.title{font:400 64px "Grandstander Black";color:#fff;-webkit-text-stroke:12px #c2407a;paint-order:stroke fill;text-shadow:0 8px 0 #c2407a}

/* top bar (both screens) */
#top{position:absolute;left:16px;right:16px;top:14px;height:100px;display:flex;align-items:center;gap:18px;pointer-events:none}
#top > *{pointer-events:auto}
#back{width:96px;height:96px;flex:none}
#back img{width:96px;filter:drop-shadow(0 6px 8px rgba(60,10,50,.25))}
#where{flex:none;padding:10px 30px;font:400 38px "Grandstander Black";color:#b0306e;border-radius:40px}
#where small{display:block;font:800 22px "Baloo 2";color:#8a6a80;margin-top:-4px}
#top .sp{flex:1}
#top .pill{flex:none}
#xchg{flex:none}

/* machine select */
#select{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;padding-top:110px}
#select .title{font-size:84px}
#cards{display:flex;gap:40px}
#select > *{zoom:1.22} /* a menu with nothing behind it: let it be bigger than the in-game HUD */
.mc{position:relative;width:440px;padding:26px 26px 30px;border-radius:50px;cursor:pointer;transition:transform .15s}
.mc:hover{transform:translateY(-10px)}
.mc .art{position:relative;height:250px;border-radius:36px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.mc .art img.m{width:170px;filter:drop-shadow(0 10px 10px rgba(0,0,0,.18))}
.mc .art img.s{position:absolute;width:90px}
.mc h3{margin:20px 0 4px;text-align:center;font:400 40px "Grandstander Black";color:var(--d);white-space:nowrap}
.mc .bet{text-align:center;font:800 28px "Baloo 2";color:#7a5a6e}
.mc .bet b{font:400 30px "Grandstander Black";color:#a86d00}
.mc .tag{position:absolute;right:18px;top:16px;padding:6px 18px;border-radius:20px;font:400 22px "Grandstander Black";color:#fff;background:var(--d);box-shadow:0 4px 0 rgba(0,0,0,.18);z-index:2}
.mc .fill{margin-top:14px;font:800 22px "Baloo 2";color:#7a5a6e}
.mc .fill .bar{height:22px;border-radius:11px;background:#f1e5ee;overflow:hidden;margin-top:6px}
.mc .fill .bar i{display:block;height:100%;border-radius:11px;background:linear-gradient(90deg,#ffd25a,#ff7eb3)}
.mc .big{margin-top:20px;height:84px;font-size:34px}
#tipsSel{max-width:1380px;padding:20px 34px;font:800 26px "Baloo 2";color:#6a4a5e;line-height:1.35}
#tipsSel b{color:#c2407a}

/* play HUD */
#play{position:absolute;inset:0;pointer-events:none}
#play > *{pointer-events:auto}
#tips{position:absolute;left:16px;top:140px;width:390px;padding:22px 24px}
#tips h4,#legend h4{margin:0 0 10px;display:flex;align-items:center;gap:10px;font:400 30px "Grandstander Black";color:#5f3fc9}
#tips h4 img,#legend h4 img{width:44px}
#tips .tp{display:flex;gap:12px;margin:12px 0;font:800 22px "Baloo 2";color:#5a2342;line-height:1.3}
#tips .tp i{flex:none;width:40px;height:40px;border-radius:50%;background:linear-gradient(#ff9cc4,#ff4f95);color:#fff;font:400 24px "Grandstander Black";font-style:normal;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #c2407a}
#tips.mini{width:auto}#tips.mini .tp{display:none}
#legend{position:absolute;right:16px;top:140px;width:330px;padding:22px 24px}
#legend .row{display:flex;align-items:center;gap:12px;margin:8px 0;font:800 22px "Baloo 2";color:#5a2342}
#legend .row img{width:52px;height:52px;object-fit:contain}
#legend .row b{margin-left:auto;font:400 24px "Grandstander Black";color:#a86d00;white-space:nowrap}
#legend .row b.t{color:#c2407a}
#ctrl{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:26px;padding:16px 26px;border-radius:56px}
#phase{width:380px}
#phase .lbl{display:flex;justify-content:space-between;font:800 22px "Baloo 2";color:#7a5a6e}
#phase .lbl b{color:#2fae7a;transition:opacity .15s}
#phase .track{position:relative;height:40px;margin-top:6px;border-radius:20px;background:#f1e5ee;overflow:hidden;box-shadow:inset 0 3px 6px rgba(160,60,110,.18)}
#phase .zone{position:absolute;left:0;top:0;bottom:0;width:18%;background:linear-gradient(90deg,#7ff0c4,#c9f6e6)}
#phase .knob{position:absolute;top:4px;width:60px;height:32px;margin-left:-30px;border-radius:16px;background:linear-gradient(#ff9cc4,#ff4f95);box-shadow:0 3px 0 #c2407a}
#drop{width:330px}
#drop.ready{animation:glow 1s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 9px 0 #c2407a,0 0 0 10px rgba(127,240,196,.55),0 16px 24px rgba(194,64,122,.35)}}
#auto{display:flex;flex-direction:column;align-items:center;gap:6px;font:800 22px "Baloo 2";color:#7a5a6e;cursor:pointer}
#auto i{width:84px;height:46px;border-radius:23px;background:#e6d6e0;position:relative;transition:background .2s}
#auto i::after{content:"";position:absolute;left:5px;top:5px;width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:left .2s}
#auto.on i{background:#2fc58e}#auto.on i::after{left:43px}
#hint{position:absolute;left:50%;bottom:170px;transform:translateX(-50%);padding:8px 26px;border-radius:24px;background:rgba(50,22,60,.62);color:#fff;font:800 24px "Baloo 2";white-space:nowrap}
#fx{position:absolute;inset:0;pointer-events:none!important;overflow:hidden;z-index:30}
.pop{position:absolute;font:400 40px "Grandstander Black";color:#ffe27a;-webkit-text-stroke:7px #a86d00;paint-order:stroke fill;animation:up 1.1s ease-out forwards;white-space:nowrap}
.pop.t{color:#ffd1e6;-webkit-text-stroke-color:#c2407a}
@keyframes up{to{transform:translateY(-140px);opacity:0}}
.callout{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font:400 110px "Grandstander Black";color:#fff27a;-webkit-text-stroke:16px #c2407a;paint-order:stroke fill;text-shadow:0 12px 0 #c2407a;white-space:nowrap;animation:callout 1.6s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes callout{0%{transform:translate(-50%,-50%) scale(.2) rotate(-10deg);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15) rotate(3deg);opacity:1}40%{transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{transform:translate(-50%,-80%) scale(1.05);opacity:0}}
.confetti{position:absolute;top:-30px;width:16px;height:26px;border-radius:4px}
#toast{position:absolute;left:50%;top:130px;transform:translateX(-50%);z-index:40;display:none;align-items:center;gap:12px;padding:12px 32px 12px 16px;border-radius:36px;background:#fff;border:4px solid #ffd0e4;color:#7a2a56;font:800 28px "Baloo 2";white-space:nowrap;box-shadow:0 8px 0 rgba(194,64,122,.3)}
#toast img{width:48px}
#modal{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(50,20,50,.5);backdrop-filter:blur(4px)}
#modal.on{display:flex}
.panel{position:relative;width:900px;padding:60px 50px 46px;border-radius:56px;background:linear-gradient(#fff,#fff4f9);border:6px solid #ffd0e4;box-shadow:0 14px 0 #f2a9c8,0 30px 60px rgba(60,10,40,.4);text-align:center}
.panel h2{margin:0 0 14px;font:400 56px "Grandstander Black";color:#c2407a}
.panel p{margin:10px 0;font:800 30px "Baloo 2";color:#6a4a5e}
.panel .row{display:flex;justify-content:center;gap:26px;margin-top:26px}
#loading{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:radial-gradient(circle at 50% 40%,#fff0f7,#ffd1e6 45%,#d9c8ff);transition:opacity .4s}
#loading.out{opacity:0;pointer-events:none}
#loading img{width:200px;animation:b .8s ease-in-out infinite alternate}
@keyframes b{to{transform:translateY(-24px) rotate(8deg)}}
#loading b{font:400 50px "Grandstander Black";color:#fff;-webkit-text-stroke:9px #c2407a;paint-order:stroke fill}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="ui">
  <div id="top">
    <div id="back" class="btn" title="Quay lại"><img src="assets/ui-jelly-pzuh/buttons-pastel/pink/icon_back_pink.png"></div>
    <div id="where" class="glass">Máy Đẩy Xu<small id="whereSub">Chọn một máy để chơi</small></div>
    <div class="sp"></div>
    <div class="pill glass"><img src="assets/emoji-fluent-3d/game/coin.png"><span id="coinTxt">0</span></div>
    <div class="pill glass tk"><img src="assets/emoji-fluent-3d/game/admission_tickets.png"><span id="tkTxt">0</span></div>
    <div class="big lemon small btn" id="xchg">Đổi vé</div>
  </div>

  <div id="select">
    <div class="title">Máy Đẩy Xu</div>
    <div id="cards"></div>
    <div id="tipsSel" class="glass"></div>
  </div>

  <div id="play" class="hide">
    <div id="tips" class="glass"><h4><img src="assets/emoji-fluent-3d/game/light_bulb.png">Mẹo chơi</h4></div>
    <div id="legend" class="glass"><h4><img src="assets/emoji-fluent-3d/game/wrapped_gift.png">Phần thưởng</h4></div>
    <div id="hint">Rê chuột hoặc kéo để ngắm · Chạm hoặc Space để thả</div>
    <div id="ctrl" class="glass">
      <div id="phase"><div class="lbl"><span>Khay đẩy</span><b id="phaseTxt">Thả ngay!</b></div><div class="track"><div class="zone"></div><div class="knob" id="knob"></div></div></div>
      <div class="big pink" id="drop"><img src="assets/emoji-fluent-3d/game/coin.png" style="width:58px">THẢ XU</div>
      <div id="auto"><i></i>Tự thả</div>
    </div>
  </div>

  <div id="fx"></div>
  <div id="toast"><img id="toastImg" src="assets/emoji-fluent-3d/game/coin.png"><span id="toastTxt"></span></div>
  <div id="modal"></div>
  <div id="loading"><img src="assets/emoji-fluent-3d/game/coin.png"><b>Đang bật máy đẩy xu…</b></div>
</div>

<script src="js/vendor/three.min.js"></script>
<script src="js/vendor/GLTFLoader.js"></script>
<script src="js/vendor/SkeletonUtils.js"></script>
<script src="js/hc3d.js"></script>
<script src="js/hc-core.js"></script>
<script src="js/pusher-sim.js"></script>
<script>
'use strict';
const Q = new URLSearchParams(location.search), SHOT = Q.has('shot');
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const A = HC.A, fmt = HC.fmt, store = HC.store, T = THREE;
const rnd = (a, b) => a + Math.random() * (b - a), pick = a => a[Math.floor(Math.random() * a.length)];
function el(tag, attrs = {}, parent) { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) { if (k === 'style') e.style.cssText = v; else if (k === 'html') e.innerHTML = v; else if (k === 'text') e.textContent = v; else e.setAttribute(k, v); } if (parent) parent.appendChild(e); return e; }
const SND = { drop: 'audio-casino-kenney/Audio/chip-lay-1.ogg', land: 'audio-casino-kenney/Audio/chips-collide-1.ogg', win: 'audio-sfx-ninja/Bonus/Coin.wav', prize: 'audio-sfx-ninja/Bonus/Gold1.wav', big: 'audio-sfx-ninja/Jingles/Success1.wav', lucky: 'audio-digital-kenney/Audio/powerUp2.ogg', no: 'audio-interface-kenney/Audio/error_004.ogg', click: 'audio-ui-kenney/Audio/click1.ogg' };
let lastSnd = {};
function snd(n, v = .5) { if (SHOT || !HC.settings.sfx) return; const now = performance.now(); if (now - (lastSnd[n] || 0) < 45) return; lastSnd[n] = now; try { const a = new Audio(A(SND[n])); a.volume = v; a.play().catch(() => {}); } catch (e) {} }

// ------------------------------------------------------------------ layout
let uiS = 1, UW = 1920, UH = 1080;
function fit() {
  uiS = HC.uiScale(1600); UW = innerWidth / uiS; UH = innerHeight / uiS;
  const ui = $('#ui'); ui.style.width = UW + 'px'; ui.style.height = UH + 'px'; ui.style.transform = `scale(${uiS})`;
  if (st) { st.w = innerWidth; st.h = innerHeight; st.renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5)); st.renderer.setSize(innerWidth, innerHeight, false); st.camera.aspect = innerWidth / innerHeight; placeCamera(); }
  $('#tips').classList.toggle('mini', UW < 1800);
  $('#tips').style.cursor = 'pointer';
}
addEventListener('resize', fit);

// ------------------------------------------------------------------ wallet
const me = { coins: store.get('coins', 1250000), tickets: store.get('tickets', 0), gems: store.get('gems', 2480) };
function wallet(dc = 0, dt = 0, dg = 0) {
  me.coins = Math.max(0, me.coins + dc); me.tickets = Math.max(0, me.tickets + dt); me.gems += dg;
  store.set('coins', me.coins); store.set('tickets', me.tickets); if (dg) store.set('gems', me.gems);
  $('#coinTxt').textContent = fmt(me.coins); $('#tkTxt').textContent = fmt(me.tickets);
}
function toast(msg, icon = 'emoji-fluent-3d/game/coin.png') { const t = $('#toast'); $('#toastTxt').textContent = msg; $('#toastImg').src = A(icon); t.style.display = 'flex'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 2300); }
function callout(text) { if (SHOT) return; const c = el('div', { class: 'callout', text }, $('#fx')); setTimeout(() => c.remove(), 1700); }
function confetti(n = 80) {
  if (SHOT) return; const cols = ['#ff6fa8', '#ffc93c', '#3ccf9b', '#4fb3ff', '#a07bff', '#fff'];
  for (let i = 0; i < n; i++) { const c = el('div', { class: 'confetti', style: `left:${rnd(0, UW)}px;background:${pick(cols)}` }, $('#fx')); c.animate([{ transform: 'translate(0,0) rotate(0)' }, { transform: `translate(${rnd(-200, 200)}px,${UH + 200}px) rotate(${rnd(-900, 900)}deg)` }], { duration: rnd(1600, 2800), delay: rnd(0, 400) }).onfinish = () => c.remove(); }
}

// ------------------------------------------------------------------ machines
const MACHINES = [
  { name: 'Máy Hồng', bet: 1000, preset: 'fresh', color: 0xff8fc0, css: '#ff5c9a', dark: '#c2407a', bg: 'linear-gradient(#ffe1ee,#ffb3d1)', icon: 'emoji-fluent-3d/animals/pig_face.png', side: 'emoji-fluent-3d/game/coin.png', note: 'Máy mới, xu còn nằm sâu' },
  { name: 'Máy Vàng', bet: 5000, preset: 'hot', color: 0xffc93c, css: '#ffb300', dark: '#a86d00', bg: 'linear-gradient(#fff4c7,#ffd25a)', icon: 'emoji-fluent-3d/game/admission_tickets.png', side: 'emoji-fluent-3d/game/coin.png', note: 'Có người vừa chơi, vé sát mép' },
  { name: 'Máy Kim Cương', bet: 20000, preset: 'rich', color: 0x8fd0ff, css: '#3d9bff', dark: '#1f6fc0', bg: 'linear-gradient(#e0f2ff,#8fd0ff)', icon: 'emoji-fluent-3d/game/gem_stone.png', side: 'emoji-fluent-3d/animals/pig_face.png', note: 'Có Heo Vàng jackpot' },
];
const TIPS = [
  ['Canh khay đẩy', 'Đợi khay đẩy lùi hết cỡ rồi mới thả. Xu rơi ngay trước khay, cú đẩy kế tiếp sẽ mạnh nhất.'],
  ['Nhắm góc sát mép', 'Thả vào bên trái hoặc phải, chỗ cuộn vé đang nằm sát mép. Tránh thả giữa nếu quà đã dồn ra hai bên.'],
  ['Chọn máy đầy', 'Máy vừa có người chơi còn nhiều xu và quà sát mép, tốn ít xu hơn máy trống.'],
];
const PRIZE_ROWS = [['coin', 'Xu rơi ra', 'emoji-fluent-3d/game/coin.png', '+1 cược', ''], ['ticket', 'Cuộn vé', 'emoji-fluent-3d/game/admission_tickets.png', '+20 vé', 't'], ['card', 'Thẻ bài', 'emoji-fluent-3d/game/joker.png', '+60 vé', 't'],
  ['star', 'Ngôi sao', 'emoji-fluent-3d/symbols/glowing_star.png', '3 xu free', ''], ['gem', 'Kim cương', 'emoji-fluent-3d/game/gem_stone.png', '+5 💎', ''], ['pig', 'Heo Vàng', 'emoji-fluent-3d/animals/pig_face.png', '+300 vé', 't']];
function saveKey(i) { return 'pusher_m' + i; }
function machineState(i) {
  let s = store.get(saveKey(i), null);
  const sim = new PusherSim.Sim({ seed: 100 + i });
  if (!s) { sim.fill(MACHINES[i].preset); s = Object.assign(sim.save(), { at: Date.now() }); store.set(saveKey(i), s); return { s, others: i === 1 }; }
  // someone else played while you were away: run a few random drops on it
  if (Date.now() - (s.at || 0) > 20 * 60 * 1000) {
    sim.load(s); for (let k = 0; k < 40; k++) { sim.drop(rnd(-4, 4)); for (let f = 0; f < 36; f++) sim.step(1 / 60); }
    for (let f = 0; f < 120; f++) sim.step(1 / 60);
    if (sim.items.filter(x => x.kind !== 'coin' && (x.state === 'field')).length < 2) { sim.add('ticket', rnd(-3, 3), 5.4); sim.add('card', rnd(-3, 3), 4.8); sim.settle(.5); }
    s = Object.assign(sim.save(), { at: Date.now() }); store.set(saveKey(i), s); return { s, others: true };
  }
  return { s, others: false };
}
function fillOf(s) { const sim = new PusherSim.Sim(); for (const [k, x, z, sh] of s.items) sim.add(k, x, z, { state: sh ? 'shelf' : 'field' }); return sim.edgeFill(); }
function showSelect() {
  mode = 'select'; $('#select').classList.remove('hide'); $('#play').classList.add('hide');
  $('#where').firstChild.textContent = 'Máy Đẩy Xu'; $('#whereSub').textContent = 'Chọn một máy để chơi';
  const box = $('#cards'); box.innerHTML = '';
  MACHINES.forEach((m, i) => {
    const { s, others } = machineState(i), fill = fillOf(s), prizes = s.items.filter(x => x[0] !== 'coin').length;
    const c = el('div', { class: 'mc glass', style: `--d:${m.dark};--bg:${m.bg}` }, box);
    el('div', { class: 'tag', text: others ? 'Vừa có người chơi' : (i === 2 ? 'Jackpot' : 'Máy mới') }, c);
    const art = el('div', { class: 'art' }, c); el('img', { class: 'm', src: A(m.icon) }, art);
    el('img', { class: 's', src: A(m.side), style: 'left:40px;bottom:30px' }, art); el('img', { class: 's', src: A('emoji-fluent-3d/game/coin.png'), style: 'right:44px;top:34px;width:70px' }, art);
    el('h3', { text: m.name }, c); el('div', { class: 'bet', html: `Mỗi xu: <b>${fmt(m.bet)}</b>` }, c);
    const f = el('div', { class: 'fill', html: `Xu sát mép: ${Math.round(fill * 100)}% · ${prizes} món quà` }, c); const bar = el('div', { class: 'bar' }, f); el('i', { style: `width:${Math.round(fill * 100)}%` }, bar);

  const tp = $('#tips'); TIPS.forEach((t, i) => el('div', { class: 'tp', html: `<i>${i + 1}</i><div><b style="color:#c2407a">${t[0]}.</b> ${t[1]}</div>` }, tp));
  const lg = $('#legend'); PRIZE_ROWS.forEach(r => el('div', { class: 'row', html: `<img src="${A(r[2])}"><span>${r[1]}</span><b class="${r[4]}">${r[3]}</b>` }, lg));
  try { await Promise.race([document.fonts.load('400 100px "Grandstander Black"'), new Promise(r => setTimeout(r, 2500))]); } catch (e) {}
  if (!HC3D.ok) { $('#loading b').textContent = 'Máy này chưa bật WebGL nên không chạy được game 3D.'; return; }
  await build3D();
  for (const [k, key] of [['star', 'mini_star'], ['gem', 'mini_diamond_blue']]) { const g = await HC3D.load(key); const o = HC3D.clone(g); const b = new T.Box3().setFromObject(o); const sz = b.getSize(new T.Vector3()); o.scale.setScalar(1.0 / Math.max(sz.x, sz.z)); o.position.y = -b.min.y / Math.max(sz.x, sz.z); const h = new T.Group(); h.add(o); HCPrefab[k] = h; }
  HC.music('music-bgm/opengameart/happy-vibes__Ruskerdax.mp3', .25);
  $('#loading').classList.add('out'); setTimeout(() => $('#loading').classList.add('hide'), 450);
  const m = Q.get('machine');
  if (m != null) startMachine(Math.max(0, Math.min(2, +m))); else showSelect();
  if (Q.get('selftest')) {   // automated check: drop coins for a while and report
    const out = { errors: [] }; addEventListener('error', e => out.errors.push(e.message));
    setInterval(() => update(1 / 30, performance.now() / 1000), 33);   // headless browsers barely run requestAnimationFrame
    const c0 = me.coins, t0 = me.tickets; let won = 0, lost = 0, prizes = 0, dropped = 0;
    const orig = handle; handle = e => { if (e.type === 'win') { e.kind === 'coin' ? won++ : prizes++; } if (e.type === 'lost') lost++; orig(e); };
    for (let i = 0; i < 40; i++) { aimX = i % 2 ? -3.2 : 3.2; cool = 0; tryDrop(); dropped++; await new Promise(r => setTimeout(r, 450)); }
    await new Promise(r => setTimeout(r, 4000));
    Object.assign(out, { dropped, won, lost, prizes, spent: c0 - me.coins + won * MACHINES[cur].bet, coinsDelta: me.coins - c0, ticketsDelta: me.tickets - t0, coinsOnField: sim.items.filter(i => i.kind === 'coin' && i.state === 'field').length, simT: +sim.t.toFixed(1), states: sim.items.reduce((m, i) => (m[i.state] = (m[i.state] || 0) + 1, m), {}), maxZ: +Math.max(...sim.items.filter(i => i.state === 'field').map(i => i.z)).toFixed(2), prizeMeshes: prizeMeshes.size, saved: !!store.get(saveKey(cur), null) });
    document.body.dataset.selftest = JSON.stringify(out);
  }
})();
</script>
