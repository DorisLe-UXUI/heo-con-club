<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heo Con Club</title>
<style>
@font-face{font-family:"Grandstander Black";src:url("assets/fonts/GrandstanderBlack-Regular.ttf") format("truetype");font-display:swap}
@font-face{font-family:"Baloo 2";src:url("assets/fonts/Baloo2%5Bwght%5D.ttf") format("truetype");font-weight:400 800;font-display:swap}
@font-face{font-family:"Nunito";src:url("assets/fonts/Nunito%5Bwght%5D.ttf") format("truetype");font-weight:200 1000;font-display:swap}
:root{--pink:#ff6fa8;--pinkd:#c2407a;--ink:#5a2342;--cream:#fffaf5}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:radial-gradient(circle at 15% 15%,rgba(255,255,255,.55),transparent 35%),radial-gradient(circle at 85% 85%,rgba(255,255,255,.45),transparent 40%),linear-gradient(135deg,#ffc9e0,#e3d4ff 50%,#c4e3ff);overflow:hidden;font-family:Nunito,system-ui,sans-serif;color:var(--ink)}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;flex:none;width:1920px;height:1080px;transform-origin:center center;overflow:hidden;border-radius:28px;background:#ffd6e8;box-shadow:0 30px 80px rgba(120,50,110,.35),0 0 0 6px rgba(255,255,255,.6)}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:block}
img{-webkit-user-drag:none;user-drag:none}
.abs{position:absolute}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cb{font-family:"Grandstander Black","Baloo 2",sans-serif;font-weight:400}
.btn{cursor:pointer;transition:transform .12s ease, filter .12s}
.btn:hover{transform:translateY(-4px) scale(1.04);filter:brightness(1.05)}
.btn:active{transform:translateY(2px) scale(.97)}
.pill{position:absolute;height:84px;padding:0 70px 0 92px;border-radius:42px;background:linear-gradient(#fff,#fff3f8);box-shadow:0 6px 0 #f3b8cf,0 10px 18px rgba(120,30,70,.18);display:flex;align-items:center;font:800 40px "Baloo 2";color:#c08f00;white-space:nowrap}
.pill img.ic{position:absolute;left:8px;top:2px;width:80px;height:80px}
.pill img.plus{position:absolute;right:10px;top:12px;width:60px;cursor:pointer}
.pill.gem{color:#2a7fd0}
.avatarbox{position:absolute;width:180px;height:180px}
.avatarbox .av{position:absolute;left:28px;top:28px;width:124px;height:124px;border-radius:50%;object-fit:cover;background:#fff}
.avatarbox .fr{position:absolute;inset:0;width:180px;height:180px;pointer-events:none}
.namecard{position:absolute;background:rgba(255,255,255,.92);border-radius:28px;padding:8px 22px 10px 22px;box-shadow:0 6px 0 #f3b8cf;min-width:220px;text-align:center}
.namecard .nm{font:400 30px "Grandstander Black";color:#9b2c5e;line-height:1.1}
.namecard .mn{font:800 26px "Baloo 2";color:#c08f00;display:flex;align-items:center;justify-content:center;gap:6px;line-height:1}
.namecard .mn img{width:32px}
/* lobby */
#toTown{position:absolute;right:24px;top:122px;height:76px;padding:0 30px 0 92px;border-radius:38px;display:flex;align-items:center;background:linear-gradient(#8ff2c8,#2fc58e);box-shadow:0 8px 0 #1f9a70,0 14px 22px rgba(31,154,112,.3);font:400 32px "Grandstander Black";color:#fff;-webkit-text-stroke:6px #1f9a70;paint-order:stroke fill;z-index:5}
#toTown img{position:absolute;left:10px;top:-8px;width:84px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.2))}
#marquee{position:absolute;left:600px;top:30px;width:430px;height:60px;border-radius:30px;background:rgba(255,255,255,.75);overflow:hidden;box-shadow:inset 0 2px 6px rgba(160,60,110,.15)}
#marquee span{position:absolute;white-space:nowrap;top:10px;font:800 28px "Baloo 2";color:#b03c74;animation:marq 16s linear infinite}
@keyframes marq{from{left:100%}to{left:-180%}}
.side{position:absolute;left:28px;width:200px;height:190px;cursor:pointer}
.side .sq{position:absolute;left:20px;top:0;width:160px;height:160px}
.side .ico{position:absolute;left:40px;top:12px;width:120px;height:120px;object-fit:contain;filter:drop-shadow(0 6px 6px rgba(80,20,60,.25))}
.side .lb{position:absolute;left:0;right:0;top:150px;text-align:center;font:400 30px "Grandstander Black";color:#fff;-webkit-text-stroke:7px #c2407a;paint-order:stroke fill}
.side .dot{position:absolute;right:16px;top:-6px;width:52px}
#tabs{position:absolute;left:622px;top:128px;display:flex;gap:14px}
.tab{height:76px;padding:0 34px;border-radius:38px;display:flex;align-items:center;font:400 32px "Grandstander Black";color:#c2407a;background:#fff;box-shadow:0 6px 0 #f0bcd2;cursor:pointer;transition:all .15s}
.tab.on{background:linear-gradient(#ff9cc4,#ff6fa8);color:#fff;box-shadow:0 6px 0 #c2407a;text-shadow:0 2px 0 #c2407a}
#grid{position:absolute;left:600px;top:214px;width:1310px;height:866px;display:grid;grid-template-columns:repeat(5,1fr);gap:12px 6px;align-content:start;overflow:auto;padding:8px 10px 30px}
#grid::-webkit-scrollbar{width:0}
.gi{position:relative;width:204px;height:204px;cursor:pointer;justify-self:center;animation:popin .45s cubic-bezier(.2,1.6,.4,1) both}
.gi img{width:100%;height:100%;transition:transform .18s cubic-bezier(.2,1.6,.4,1);filter:drop-shadow(0 10px 10px rgba(120,30,80,.25))}
.gi:hover img{transform:translateY(-10px) rotate(-2deg) scale(1.06)}
.gi:active img{transform:scale(.95)}
.gi .online{position:absolute;left:14px;top:10px;font:800 18px "Baloo 2";color:#fff;background:rgba(60,207,155,.95);border-radius:14px;padding:0 10px;box-shadow:0 3px 0 #1f9a70}
#lobby .rainbow{position:absolute;inset:0;background:linear-gradient(120deg,#ffc6e0,#d9c9ff,#bfe8ff,#c8ffe6,#fff0b8,#ffd0b8,#ffc6e0);background-size:400% 400%;animation:huebg 22s ease infinite}
@keyframes huebg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
#lobby .bg.soft{opacity:.45;mix-blend-mode:soft-light}
#deco3d{position:absolute;inset:0;width:1920px;height:1080px;pointer-events:none;z-index:1}
#lobby>*:not(.bg):not(.rainbow):not(#deco3d){z-index:2}
#hero{position:absolute;left:22px;top:178px;width:560px;height:888px;border-radius:52px;background:linear-gradient(165deg,rgba(255,255,255,.62),rgba(255,255,255,.18));box-shadow:0 10px 0 rgba(194,64,122,.25),0 24px 48px rgba(110,40,120,.18),inset 0 2px 0 rgba(255,255,255,.9);overflow:visible}
#hero canvas{position:absolute;left:0;top:0;width:560px;height:560px;border-radius:52px 52px 0 0;cursor:pointer}
#hero .heroimg{position:absolute;left:60px;top:10px;width:440px;display:none}
#hero .arrow{position:absolute;top:232px;width:78px;cursor:pointer;transition:transform .12s;z-index:3}
#hero .arrow:hover{transform:scale(1.1)}#hero .arrow:active{transform:scale(.92)}
#mascotName{position:absolute;left:50%;top:500px;transform:translateX(-50%);padding:6px 30px;border-radius:30px;background:linear-gradient(#fff,#ffeef6);box-shadow:0 5px 0 #f0bcd2;font:400 32px "Grandstander Black";color:#c2407a;white-space:nowrap;z-index:3}
#heroBubble{position:absolute;left:260px;top:30px;max-width:290px;padding:12px 20px;border-radius:26px;background:#fff;box-shadow:0 8px 18px rgba(110,40,90,.2);font:800 24px "Baloo 2";color:#9b2c5e;display:none;z-index:4}
#heroBubble:after{content:"";position:absolute;left:30px;bottom:-16px;border:10px solid transparent;border-top:16px solid #fff}
#cta{position:absolute;left:30px;top:572px;width:500px;height:124px;border-radius:64px;cursor:pointer;overflow:hidden;background:linear-gradient(90deg,#ff5c9a,#ffb347,#ffe14a,#5fe0a0,#4fb3ff,#a07bff,#ff5c9a);background-size:300% 100%;animation:ctaGrad 6s linear infinite;box-shadow:0 10px 0 #b8336f,0 16px 30px rgba(184,51,111,.35),inset 0 4px 0 rgba(255,255,255,.55);transition:transform .14s;z-index:3}
#cta:hover{transform:translateY(-4px) scale(1.02)}#cta:active{transform:translateY(4px) scale(.98)}
@keyframes ctaGrad{to{background-position:300% 0}}
#cta:before{content:"";position:absolute;top:0;left:-40%;width:30%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-20deg);animation:shine 2.6s ease-in-out infinite}
@keyframes shine{0%{left:-40%}60%,100%{left:130%}}
#cta span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;padding-bottom:6px;font:400 44px "Grandstander Black";color:#fff;-webkit-text-stroke:9px #b8336f;paint-order:stroke fill}
#cta img{width:70px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.2))}
#quick4{position:absolute;left:18px;top:724px;width:524px;display:flex;justify-content:space-between;z-index:3}
.q4{position:relative;width:122px;cursor:pointer;text-align:center;transition:transform .14s}
.q4:hover{transform:translateY(-5px)}.q4:active{transform:scale(.94)}
.q4 .disc{width:112px;height:112px;margin:0 auto;border-radius:36px;display:flex;align-items:center;justify-content:center;box-shadow:0 7px 0 var(--d),0 12px 20px rgba(80,20,60,.2),inset 0 3px 0 rgba(255,255,255,.6)}
.q4 .disc img{width:88px;height:88px;object-fit:contain;filter:drop-shadow(0 5px 5px rgba(60,20,50,.25))}
.q4 .t{margin-top:10px;font:400 25px "Grandstander Black";color:#fff;-webkit-text-stroke:6px var(--d);paint-order:stroke fill;white-space:nowrap}
.q4 .dot{position:absolute;right:2px;top:-8px;width:40px}
#lobby .side{display:none}
#bottomnav{display:none!important;position:absolute;left:560px;bottom:12px;width:800px;height:96px;border-radius:48px;background:rgba(255,255,255,.9);box-shadow:0 8px 0 #f0bcd2,0 12px 24px rgba(120,30,70,.2);display:flex;justify-content:space-around;align-items:center}
.nv{display:flex;flex-direction:column;align-items:center;cursor:pointer;font:800 20px "Baloo 2";color:#b0789a;transition:transform .15s}
.nv img{width:54px;height:54px;transition:transform .2s}
.nv.on{color:#ff4f95}.nv.on img{transform:scale(1.18) translateY(-4px)}
.nv:hover{transform:translateY(-3px)}
.float{animation:float 3.2s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes popin{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.pulse{animation:pulse 1.4s ease-in-out infinite}
/* modal */
#modal{position:absolute;inset:0;background:rgba(60,20,50,.45);display:none;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(3px)}
#modal.on{display:flex}
.panel{position:relative;width:1100px;min-height:640px;border-radius:56px;background:linear-gradient(#ffd1e3,#ff8fbf);box-shadow:0 14px 0 #c2407a,0 30px 60px rgba(60,10,40,.4);padding:110px 40px 44px;animation:popin .38s cubic-bezier(.2,1.6,.4,1) both}
.panel.mint{background:linear-gradient(#c9f6e6,#5fd9ac);box-shadow:0 14px 0 #1f9a70,0 30px 60px rgba(10,60,40,.35)}
.panel.sky{background:linear-gradient(#d3ecff,#6fbfff);box-shadow:0 14px 0 #2a7fd0,0 30px 60px rgba(10,40,80,.35)}
.panel.lav{background:linear-gradient(#e6dcff,#ad8cff);box-shadow:0 14px 0 #6c4bd1,0 30px 60px rgba(40,20,80,.35)}
.panel .inner{background:linear-gradient(#fffdf8,#fff3ea);border-radius:40px;padding:30px;min-height:470px;box-shadow:inset 0 4px 10px rgba(160,80,110,.12)}
.panel .ttl{position:absolute;left:50%;top:-34px;transform:translateX(-50%);width:600px;height:130px}
.panel .ttl img{width:100%;height:100%}
.panel .ttl span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-bottom:22px;font:400 52px "Grandstander Black";color:#fff;-webkit-text-stroke:8px #c2407a;paint-order:stroke fill}
.panel .x{position:absolute;right:-26px;top:-26px;width:100px;cursor:pointer}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:12px}
.day{position:relative;cursor:pointer;transition:transform .15s}
.day img{width:100%}
.day.done img{filter:grayscale(.7) brightness(1.05);opacity:.7}
.day.done:after{content:"✔";position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font:900 80px "Baloo 2";color:#3ccf9b;-webkit-text-stroke:5px #fff;paint-order:stroke fill}
.day.today{animation:pulse 1.2s infinite}
.row2{display:flex;align-items:center;justify-content:space-between;margin:12px 6px;font:800 34px "Baloo 2";color:#7a3a5c}
.row2 img{height:70px;cursor:pointer}
.avgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:10px;max-height:300px;overflow:auto;padding:6px}
.avgrid img{width:86px;height:86px;border-radius:50%;object-fit:cover;background:#ffe9f2;cursor:pointer;border:4px solid transparent;transition:transform .15s}
.avgrid img:hover{transform:scale(1.1)}
.avgrid img.sel{border-color:#ff6fa8}
.frgrid{display:flex;gap:10px;margin-top:14px}
.frgrid img{width:110px;cursor:pointer;transition:transform .15s;border-radius:50%}
.frgrid img.sel{background:#ffe1ee;transform:scale(1.1)}
.shop{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.pack{position:relative;border-radius:34px;background:linear-gradient(#fff,#ffeef6);box-shadow:0 8px 0 #f0bcd2;padding:16px;text-align:center;cursor:pointer;transition:transform .15s}
.pack:hover{transform:translateY(-6px)}
.pack img{width:150px;height:150px;object-fit:contain}
.pack .amt{font:800 40px "Baloo 2";color:#c08f00}
.pack .price{margin-top:6px;display:inline-block;padding:4px 26px;border-radius:24px;background:linear-gradient(#7fe3b8,#3ccf9b);color:#fff;font:400 30px "Grandstander Black";box-shadow:0 5px 0 #1f9a70}
.lb-row{display:flex;align-items:center;gap:18px;padding:8px 18px;border-radius:24px;margin:6px 0;background:#fff;box-shadow:0 4px 0 #f0d1df;font:800 30px "Baloo 2";color:#7a3a5c}
.lb-row img.a{width:70px;height:70px;border-radius:50%}
.lb-row img.m{width:58px}
.lb-row .sc{margin-left:auto;color:#c08f00}
/* game screen */
#gtop{position:absolute;left:0;right:0;top:0;height:120px;z-index:10;pointer-events:none}
#gtop>*{pointer-events:auto}
#gtitle{position:absolute;left:128px;top:14px;width:440px;height:96px}
#gtitle img{width:100%;height:100%}
#gtitle span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-bottom:18px;font:400 40px "Grandstander Black";color:#fff;-webkit-text-stroke:8px #c2407a;paint-order:stroke fill}
#garea{position:absolute;inset:0}
.card{position:absolute;width:140px;height:202px;transition:transform .25s cubic-bezier(.2,1.4,.4,1), left .35s cubic-bezier(.2,1.2,.4,1), top .35s cubic-bezier(.2,1.2,.4,1);filter:drop-shadow(0 6px 6px rgba(80,20,50,.3));cursor:pointer}
.card.sel{filter:drop-shadow(0 0 14px #ffd23a) drop-shadow(0 6px 6px rgba(80,20,50,.3))}
.card.small{width:100px;height:144px}
.gbtn{position:absolute;width:300px;height:100px;cursor:pointer;transition:transform .12s;z-index:20}
.gbtn img{width:100%;height:100%}
.gbtn span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-bottom:10px;font:400 40px "Grandstander Black";color:#fff;-webkit-text-stroke:7px var(--sc,#c2407a);paint-order:stroke fill}
.gbtn:hover{transform:translateY(-4px) scale(1.03)}.gbtn:active{transform:scale(.96)}
.backstack{position:absolute;width:80px;height:115px}
.backstack img{position:absolute;width:80px}
.badge{position:absolute;right:-26px;top:-24px;width:52px;height:52px;border-radius:50%;background:linear-gradient(#ff9cc4,#ff5c9a);border:4px solid #fff;color:#fff;font:800 26px "Baloo 2";display:flex;align-items:center;justify-content:center;box-shadow:0 4px 8px rgba(0,0,0,.2)}
.bubble{position:absolute;padding:10px 26px;border-radius:30px;background:#fff;font:400 30px "Grandstander Black";color:#9b2c5e;box-shadow:0 6px 14px rgba(80,20,50,.2);animation:popin .3s cubic-bezier(.2,1.6,.4,1) both;white-space:nowrap}
.emote{position:absolute;width:150px;height:150px;pointer-events:none;animation:popin .35s cubic-bezier(.2,1.6,.4,1) both;filter:drop-shadow(0 8px 10px rgba(80,20,50,.25));z-index:20}
#emopick{position:absolute;right:30px;top:230px;width:520px;padding:18px;border-radius:34px;background:rgba(255,255,255,.96);box-shadow:0 10px 0 #f0bcd2,0 20px 40px rgba(80,20,50,.25);display:none;grid-template-columns:repeat(6,1fr);gap:8px;z-index:30}
#emopick.on{display:grid}
#emopick img{width:72px;height:72px;cursor:pointer;transition:transform .12s}
#emopick img:hover{transform:scale(1.2)}
.betarea{position:absolute;cursor:pointer;transition:transform .12s, filter .2s}
.betarea:hover{transform:translateY(-4px)}
.betarea.win{filter:drop-shadow(0 0 22px #ffe14a) drop-shadow(0 0 10px #fff) brightness(1.08);animation:pulse .6s 3}
.betarea .stack{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:90px;height:90px;pointer-events:none}
.betarea .stack img{position:absolute;left:0;width:90px}
.betarea .amt{position:absolute;left:50%;top:-30px;transform:translateX(-50%);padding:2px 16px;border-radius:20px;background:#fff;font:800 28px "Baloo 2";color:#c08f00;box-shadow:0 4px 0 #f0d1df;display:none}
.chipsel{position:absolute;display:flex;gap:16px;left:50%;transform:translateX(-50%)}
.chipsel img{width:110px;cursor:pointer;transition:transform .15s}
.chipsel img.on{transform:translateY(-18px) scale(1.12);filter:drop-shadow(0 0 12px #fff)}
.shake{animation:shk .5s linear}
@keyframes shk{0%,100%{transform:translate(0,0)}20%{transform:translate(-14px,6px) rotate(-1deg)}40%{transform:translate(12px,-8px) rotate(1deg)}60%{transform:translate(-10px,4px)}80%{transform:translate(8px,-4px)}}
.bowlshake{animation:bshk .18s linear infinite}
@keyframes bshk{0%,100%{transform:translate(-50%,0) rotate(0)}25%{transform:translate(calc(-50% - 16px),-6px) rotate(-5deg)}75%{transform:translate(calc(-50% + 16px),-6px) rotate(5deg)}}
.hist{position:absolute;display:flex;gap:6px}
.hist img{width:48px}
.cell{position:absolute;cursor:pointer}
.piece{position:absolute;width:84px;height:84px;cursor:pointer;transition:left .3s cubic-bezier(.2,1.3,.4,1), top .3s cubic-bezier(.2,1.3,.4,1), transform .15s;z-index:2}
.piece.sel{transform:scale(1.15) translateY(-6px);filter:drop-shadow(0 0 12px #ffd23a)}
.fish{position:absolute;pointer-events:auto;cursor:crosshair}
.fish.caught{transition:all .6s ease-in;transform:scale(.2) rotate(540deg)!important;opacity:0}
.plustxt{position:absolute;font:400 40px "Grandstander Black";color:#fff27a;-webkit-text-stroke:6px #a5205a;paint-order:stroke fill;pointer-events:none;animation:rise 1s ease-out forwards}
@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-90px);opacity:0}}
#fx{position:absolute;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.callout{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);pointer-events:none}
.confetti{position:absolute;top:-30px;width:16px;height:26px;border-radius:5px}
#loading{background:linear-gradient(#ffd6e8,#c9c2ff)}
#loading .logo{position:absolute;left:50%;top:140px;transform:translateX(-50%);text-align:center}
#loading .bar{position:absolute;left:660px;top:760px;width:600px;height:56px}
#loading .bar img{position:absolute;left:0;top:0;height:56px}
#loading .tip{position:absolute;left:0;right:0;top:920px;text-align:center;font:800 32px "Baloo 2";color:#a14b78}
#tapstart{position:absolute;left:750px;top:770px;display:none}
#toast{position:absolute;left:50%;top:150px;transform:translateX(-50%);padding:14px 34px;border-radius:30px;background:rgba(255,255,255,.96);font:800 30px "Baloo 2";color:#9b2c5e;box-shadow:0 8px 0 #f0bcd2;z-index:70;display:none}
</style>
</head>
<body>
<div id="wrap"><div id="stage">

<!-- LOADING -->
<div id="loading" class="screen on">
  <div class="logo">
    <img src="assets/emoji-noto-animated/pig_1f416/512.webp" style="width:260px" class="float">
    <div class="cb" id="logoText"></div>
  </div>
  <div class="bar"><img id="barbg" src="assets/ui-premium-generated/controls/progress_empty.png" style="width:600px"><img id="barfill" src="assets/ui-premium-generated/controls/progress_fill_pink.png" style="width:0px;top:3px;height:50px;object-fit:cover;object-position:left"></div>
  <div class="tip" id="tip">Đang xào bài…</div>
  <div id="tapstart" class="gbtn btn" style="--sc:#1f9a70;width:420px;height:130px"><img src="assets/ui-premium-generated/buttons/pill_mint.png"><span style="font-size:52px">Vào chơi</span></div>
</div>

<!-- LOBBY -->
<div id="lobby" class="screen">
  <div class="rainbow"></div>
  <img class="bg soft" src="assets/ui-premium-generated/lobby-backgrounds/lobby_dream_1920x1080.png">

  if (adv) ch.play(big ? pick(['Jump_Full_Short', 'Spawn_Ground']) : pick(['Interact', 'Use_Item', 'Idle_B']), { once: true, then: 'Idle_A' });
  else ch.play(big ? 'cheer' : 'Interact');
  if (big) { sfx(pick(['jump', 'bounce'])); heroSay(pick(HERO_LINES)); }
}
$('#mascotCv').addEventListener('click', () => heroAct(true));
$('#mascotImg').addEventListener('click', () => heroSay(pick(HERO_LINES)));
$('#mPrev').onclick = () => { sfx('click'); setMascot(mascotIdx - 1); };
$('#mNext').onclick = () => { sfx('click'); setMascot(mascotIdx + 1); };
$('#cta').onclick = () => { sfx('accept'); openGame(GAMES[0]); };
async function initDeco() {
  if (!window.HC3D || !HC3D.ok || SHOT) return;
  try {
    const st = new HC3D.Stage($('#deco3d'), { width: 1920, height: 1080, ortho: true, pixelRatio: 1 });
    const keys = ['mini_star', 'mini_heart_red', 'mini_diamond_blue', 'bgb_coin_gold', 'mini_heart_yellow', 'mini_diamond_red', 'mini_star', 'mini_heart_blue', 'mini_diamond_yellow', 'bgb_coin_gold', 'mini_star', 'mini_heart_red'];
    const items = [];
    for (let i = 0; i < keys.length; i++) {
      const s = 26 + Math.random() * 26;
      const h = await HC3D.decor(st, keys[i], { faceCamera: keys[i].includes('coin'), scale: keys[i].includes('coin') ? s * 1.3 : s, opacity: .55 });
      h.position.set(620 + Math.random() * 1280, -(Math.random() * 1080), -200);
      items.push({ h, vy: 18 + Math.random() * 26, rs: (Math.random() - .5) * 2, ph: Math.random() * 6 });
    }
    st.onUpdate((dt, t) => { for (const it of items) { it.h.position.y += it.vy * dt; if (it.h.position.y > 80) { it.h.position.y = -1160; it.h.position.x = 620 + Math.random() * 1280; } it.h.position.x += Math.sin(t * .6 + it.ph) * 8 * dt; it.h.rotation.y += it.rs * dt; it.h.rotation.z = Math.sin(t + it.ph) * .3; } });
    st.start();
  } catch (e) { console.warn('deco off', e); }
}
initHero(); initDeco();

// ------------------------------------------------------------------ start
$('#toTown').onclick = () => { sfx('accept'); HC.goto('index.html', 'Đang về thị trấn…'); };
refreshMe(); renderLobby(); boot();
</script>
