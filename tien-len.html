  <li><b>Đếm lá</b>: có người hết bài là kết thúc ván. Mỗi nhà trả người về nhất <b>1 cược cho mỗi lá</b> còn trên tay; <b>cóng</b> trả 26 (13 lá × 2); còn heo / hàng thì cộng thêm tiền thối như trên. Tiền chặt vẫn tính.</li>
  <li><b>Nhất ăn tất</b>: có người hết bài là kết thúc ván. Mỗi nhà trả người về nhất <b>3 cược</b>, cóng trả 6. Không tính thối. Tiền chặt vẫn tính.</li>
  <li><b>Miền Bắc</b> (tính tiền như Xếp hạng): bài phải <b>đồng chất</b>. Rác chỉ chặn bằng lá lớn hơn <b>cùng chất</b>; heo chặn được mọi lá rác, heo chất lớn chặn heo chất nhỏ. <b>Đôi</b> phải cùng màu (2 đỏ hoặc 2 đen) và chặn bằng đôi cùng màu. <b>Sám cô</b> chặn bằng sám cô lớn hơn có cùng bộ chất. <b>Sảnh</b> phải đồng chất, chặn bằng sảnh cùng chất, cùng số lá. Không có đôi thông. <b>Tứ quý</b> chặt 1 heo hoặc đôi heo (và tứ quý nhỏ hơn). Không có tới trắng, không có cóng. <b>Về bằng heo hoặc tứ quý</b> (lá cuối là heo / tứ quý) bị xử <b>thua chót</b>. Thối chỉ tính heo và tứ quý.</li>
  <li><b>Solo 2 người</b>: bạn và 1 bot ngồi đối diện, mỗi người 13 lá, 26 lá còn lại không dùng. Luật Miền Nam; ván đầu ai có lá nhỏ nhất đi trước. Người thua trả theo số lá còn lại (như Đếm lá).</li></ul>`;
}
function modalRelief(inner) {
  const ok = coins < 50000;
  inner.innerHTML = `<div style="text-align:center;padding:20px"><img src="${A('emoji-noto-animated/money-with-wings_1f4b8/512.webp')}" style="width:180px"><div style="font:800 34px 'Baloo 2';color:#7a3a5c;margin-top:10px">${ok ? 'Nhận 100.000 xu cứu trợ để chơi tiếp!' : 'Còn từ 50.000 xu trở lên thì chưa nhận cứu trợ được nha 😉'}</div></div>`;
  if (ok) { const bs = el('div', { class: 'mbtns' }, inner); const b = el('div', { class: 'mbtn', style: '--sc:#1f9a70' }, bs); img('ui-premium-generated/buttons/pill_mint.png', '', b); el('span', { text: 'Nhận xu' }, b);
    b.onclick = () => { sfx('gold'); setCoins(coins + 100000); confetti(50); closeModal(true); renderRooms(); }; }
}
function modalConfirm(inner, p) {
  inner.innerHTML = `<div style="text-align:center;font:800 34px 'Baloo 2';color:#7a3a5c;padding:20px">Rời bàn giữa ván sẽ bị xử thua <b style="color:#c2407a">−${fmt(room.bet * 3)}</b> xu.<br>Bạn chắc chứ?</div>`;
  const bs = el('div', { class: 'mbtns' }, inner);
  const a = el('div', { class: 'mbtn', style: '--sc:#8a8496' }, bs); img('ui-premium-generated/buttons/pill_grey.png', '', a); el('span', { text: 'Rời bàn' }, a);
  const b = el('div', { class: 'mbtn', style: '--sc:#1f9a70' }, bs); img('ui-premium-generated/buttons/pill_mint.png', '', b); el('span', { text: 'Chơi tiếp' }, b);
  a.onclick = () => { closeModal(true); leaveTable(); }; b.onclick = () => closeModal();
}

// ================================================================== play with friends (js/tl-online.js over js/hc-online.js)
var NET = null;
function netOn() { return !!(NET && NET.active); }
/** Why this browser cannot play online right now (null = it can). */
function netWhy() {
  const o = window.HC && HC.online;
  if (!o || !window.TLNet) return 'Trang này thiếu phần chơi online.';
  if (!o.available) return o.isHttp || o.mock ? 'Chủ game chưa bật chơi online (cần cấu hình Firebase, xem docs/ONLINE_SETUP.md).' : 'Chơi với bạn cần mở bản web của game:\n' + o.webUrl;
  if (!o.isGoogle()) return 'Đăng nhập bằng Google ở màn hình đăng nhập của thị trấn để chơi chung bàn với bạn bè.';
  return null;
}
function netCtl() {
  if (NET) return NET;
  NET = TLNet.controller({ TL, online: HC.online, hooks: {
    onRoom: (r, info) => {
      if (!info.playing) showWaitRoom(r, info);
      if (info.host && !netCtl.wasHost && G && G.over && !inGame) { toast('Bạn đang là chủ phòng', 1800); clearInterval(autoNext); later(nextGame, 2500); }
      netCtl.wasHost = info.host;
    },
    onGame: netGame,
    onMove: async (p, a, cards, ev) => { if (p === 0) myTurn = false; stopTimer(); await run(ev); loop(); },
    onClosed: msg => { toast(msg, 2400); netBack(); },
    makeBot: seat => { const b = bot(seat); return { name: b.name, av: b.av, fr: b.fr, coins: b.coins, ai: b.ai }; },
  } });
  return NET;
}
async function netGame(st, G0, ev, ps) {
  const r = NET.room;
  room = ROOMS[r.stake] || ROOMS[0]; mode = MODES.find(m => m.id === r.mode) || MODES[0];
  const old = players;
  players = ps.map((q, i) => i === 0 ? { name: ME.name, av: ME.av, fr: ME.fr, me: true }
    : { name: q.name || 'Bạn Heo', av: q.av || BOT_AVS[i], fr: q.fr || 'pink', ai: q.ai, human: !q.bot, coins: old[i] && old[i].name === q.name ? old[i].coins : q.coins || room.min });
  if (!$('#table').classList.contains('on')) {
    $('#tbg').src = A(`bg-tables-generated/with-table/table_scene_${room.theme}.png`);
    $('#roomChip').src = A(`games/card-shared/chips/chip_${room.chip}.png`);
    $$('.screen').forEach(s => s.classList.remove('on')); $('#table').classList.add('on');
    music(); initTable3D();
  }
  buildSeats(); setCoins(coins, false);
  gameNo = st.no - 1; firstGame = !!st.first; starter = st.starter == null ? null : TLNet.toLocal(st.starter, NET.seat);
  await startGame(G0, ev);
}
/** The waiting room: code to share, who is in, start button for the host. */
function showWaitRoom(r, info) {
  if ($('#table').classList.contains('on') && inGame) return;
  if (!showWaitRoom.checked) { showWaitRoom.checked = true; const t = ROOMS[r.stake] || ROOMS[0];
    if (coins < t.min) { toast(`Phòng này cần ít nhất ${short(t.min)} xu`, 2400); netQuit(); return; } }
  let inner = $('#modal.on .wroom');
  if (!inner) { inner = openModal('wroom').querySelector('.inner'); }
  const tier = ROOMS[r.stake] || ROOMS[0], md = MODES.find(m => m.id === r.mode) || MODES[0], me = HC.online.user();
  inner.innerHTML = '';
  el('div', { class: 'fr-note', text: `${md.name} · Bàn ${tier.name} · Cược ${short(tier.bet)} mỗi phần` }, inner);
  el('div', { class: 'bigcode', text: NET.code }, inner);
  el('div', { class: 'fr-note', text: 'Gửi mã này cho bạn bè: vào Tiến Lên → Chơi với bạn → nhập mã. Ghế trống sẽ có máy chơi thay.' }, inner);
  const g = el('div', { class: 'wseats' }, inner);
  for (let k = 0; k < 4; k++) {
    const s = r.seats.find(x => x.seat === k);
    const c = el('div', { class: 'wseat' + (s ? '' : ' empty') + (s && me && s.uid === me.uid ? ' me' : '') }, g);
    if (s && s.uid === r.host) el('div', { class: 'crown', text: '👑' }, c);
    img(s && s.av ? s.av : 'emoji-fluent-3d/characters/robot.png', '', c);
    el('b', { text: s ? s.name : 'Ghế trống' }, c); el('span', { text: s ? (s.uid === r.host ? 'Chủ phòng' : 'Đã vào') : 'Máy chơi thay' }, c);
  }
  if (info.waiting) el('div', { class: 'fr-note', text: '⏳ Ván đang chơi, bạn sẽ vào từ ván sau.' }, inner);
  const bs = el('div', { class: 'mbtns' }, inner);
  const out = el('div', { class: 'mbtn', style: '--sc:#8a8496' }, bs); img('ui-premium-generated/buttons/pill_grey.png', '', out); el('span', { text: 'Rời phòng' }, out);
  const inv = el('div', { class: 'mbtn', style: '--sc:#2a7fd0' }, bs); img('ui-premium-generated/buttons/pill_sky.png', '', inv); el('span', { text: 'Chép link mời' }, inv);
  out.onclick = () => { sfx('click'); netQuit(); };
  inv.onclick = () => {
    const link = location.origin + location.pathname + '?join=' + NET.code + (HC.online.mock ? '&mockfb=1' : '');
    (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject()).then(() => toast('Đã chép link mời, dán gửi bạn bè nhé'), () => toast(link, 4000)); sfx('click');
  };
  if (info.host) {
    const go = el('div', { class: 'mbtn', style: '--sc:#1f9a70' }, bs); img('ui-premium-generated/buttons/pill_mint.png', '', go); el('span', { text: 'Bắt đầu' }, go);
    go.onclick = () => { sfx('accept'); room = tier; go.style.pointerEvents = 'none'; NET.deal(Object.assign({ mustPlay3s: S.must3s }, md.opts)).catch(e => { toast(e.message); go.style.pointerEvents = ''; }); };
  } else el('div', { class: 'fr-note', text: 'Chờ chủ phòng bấm Bắt đầu…' }, inner);
}
function netBack() { showWaitRoom.checked = false; netCtl.wasHost = false; clearTimers(); stopTimer(); clearInterval(autoNext); closeModal(true); inGame = false; G = null; hourglassAt(-1); $$('.screen').forEach(s => s.classList.remove('on')); $('#rooms').classList.add('on'); renderRooms(); }
function netQuit() { if (NET) NET.leave(); netBack(); }
function modalFriends(inner) {
  const why = netWhy();
  if (why) {
    el('div', { class: 'fr-note', style: 'white-space:pre-line;padding:30px 20px', text: why }, inner);
    if (window.HC && HC.online && HC.online.available) { const bs = el('div', { class: 'mbtns' }, inner); const b = el('div', { class: 'mbtn', style: '--sc:#c2407a' }, bs); img('ui-premium-generated/buttons/pill_pink.png', '', b); el('span', { text: 'Về thị trấn' }, b); b.onclick = () => HC.goto('index.html', 'Đang về thị trấn…'); }
    return;
  }
  const modes = MODES.filter(m => !m.opts.seats);
  let md = modes.includes(mode) ? mode : modes[0], tier = Math.max(0, ROOMS.map((r, i) => coins >= r.min ? i : -1).filter(i => i >= 0).slice(0, 2).pop() ?? 0);
  const s1 = el('div', { class: 'fr-sec' }, inner); el('h3', { text: '🏠 Mở phòng mới' }, s1);
  const segM = el('div', { class: 'seg' }, s1), segT = el('div', { class: 'seg' }, s1);
  const draw = () => {
    segM.innerHTML = ''; segT.innerHTML = '';
    modes.forEach(m => { const t = el('span', { text: m.name, class: m === md ? 'on' : '' }, segM); t.onclick = () => { md = m; sfx('click'); draw(); }; });
    ROOMS.forEach((r, i) => { const ok = coins >= r.min; const t = el('span', { text: `${r.name} ${short(r.bet)}`, class: (i === tier ? 'on' : ''), style: ok ? '' : 'opacity:.4' }, segT); t.onclick = () => { if (!ok) { sfx('error'); toast(`Cần ${short(r.min)} xu`); return; } tier = i; sfx('click'); draw(); }; });
  };
  draw();
  const b1 = el('div', { class: 'mbtns' }, s1); const mk = el('div', { class: 'mbtn', style: '--sc:#c2407a' }, b1); img('ui-premium-generated/buttons/pill_pink.png', '', mk); el('span', { text: 'Mở phòng' }, mk);
  mk.onclick = async () => { sfx('accept'); mk.style.pointerEvents = 'none'; try { room = ROOMS[tier]; mode = md; showWaitRoom.checked = true; await netCtl().create({ tier, mode: md.id }); } catch (e) { toast(e.message, 2600); mk.style.pointerEvents = ''; } };
  const s2 = el('div', { class: 'fr-sec' }, inner); el('h3', { text: '🔑 Vào phòng của bạn' }, s2);
  const row = el('div', { class: 'fr-code' }, s2);
  const inp = el('input', { maxlength: '6', inputmode: 'numeric', placeholder: '······', autocomplete: 'off' }, row);
  const jb = el('div', { class: 'mbtn', style: '--sc:#1f9a70' }, row); img('ui-premium-generated/buttons/pill_mint.png', '', jb); el('span', { text: 'Vào phòng' }, jb);
  inp.oninput = () => { inp.value = inp.value.replace(/\D/g, '').slice(0, 6); };
  inp.onkeydown = e => { if (e.key === 'Enter') jb.click(); e.stopPropagation(); };
  jb.onclick = () => { if (inp.value.length !== 6) { sfx('error'); toast('Mã phòng gồm 6 chữ số'); return; } sfx('accept'); netJoin(inp.value); };
}
async function netJoin(code) {
  const why = netWhy(); if (why) { openModal('friends'); return; }
  try { showWaitRoom.checked = false; await netCtl().join(code); } catch (e) { toast(e.message, 2600); NET && NET.active && NET.leave(); }
}

// ================================================================== boot
if (window.HC) HC.arrive();
renderRooms();
initRooms3D();
$('#friends').onclick = () => { sfx('click'); openModal('friends'); };
if (/^\d{6}$/.test(Q.get('join') || '')) netJoin(Q.get('join'));
else if (Q.get('room') != null) joinRoom(Math.max(0, Math.min(ROOMS.length - 1, +Q.get('room'))));
if (Q.get('uitest') || Q.get('pose')) { const s = document.createElement('script'); s.src = 'js/tienlen-uitest.js'; document.body.appendChild(s); }
window.__TL_UI = { get G() { return G; }, get players() { return players; }, get gameNo() { return gameNo; }, coins: () => coins };
</script>
